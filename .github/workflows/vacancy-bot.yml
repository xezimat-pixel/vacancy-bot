name: vacancy-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: vacancy-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка каналов
        run: python main.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - name: Сохранить состояние (зашифровано)
        if: always()
        run: |
          git config user.name "vacancy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -X theirs && git push)
