# Настройки бота вакансий. Меняй смело, код трогать не нужно.

# Название приватной группы, куда бот складывает вакансии
group_title: "Вакансии"

# Откуда брать вакансии. Формат: @username, https://t.me/username,
# или просто название группы/канала точно как в Телеграме, например "МИР КРЕАТОРОВ".
# Публичные каналы читаются без аккаунта Telegram. Закрытые инвайты (https://t.me/+xxxx)
# и группы читаются только если подключён аккаунт (TG_API_ID, TG_API_HASH, login.command).
channels:
  # Видео и рилс
  - "@editors_video"
  - "@vakansii_reelsmaker"
  - "@GetJob_videoedit"
  - "@prodjob"
  - "@smmlancer"
  - "@workasap"
  # Моушн, 3D, CG
  - "@motionhunter"
  - "@cgfreelance"
  # Дизайн, постеры, презентации
  - "@designhunters"
  - "@designbirzha"
  - "@zakaz_design"
  - "@vakansi_rus"
  - "@board_axolotl"
  - "@designer_work"
  - "@workindesign"
  - "@freelancetaverna"
  # Творческая удалёнка и ивент
  - "@rueventjob"
  # ИИ
  - "@aivacancychannel"
  - "@ai_job_ru"
  # Зарубежные заказчики (на английском)
  - "@allgigs"
  # Закрытые группы: заработают, когда будет api_id и вход в аккаунт
  # - "МИР КРЕАТОРОВ"

# Разделы: ключ (латиницей) и название темы в группе.
# Ключ "doubt" обязателен: туда падают пограничные вакансии.
sections:
  montage: "Монтаж"
  motion: "Моушн"
  posters: "Постеры и полиграфия"
  3d: "3D"
  event: "Заставки на мероприятия"
  presentations: "Презентации"
  ai: "ИИ и автоматизация"
  doubt: "Сомнительное"

# Кто ты. ИИ использует это, чтобы решать, подходит ли вакансия, и писать отклик.
profile: |
  Видеомонтажёр и моушн дизайнер, опыт с 2022 года.
  Программы: After Effects, Premiere Pro, Photoshop, 3D.
  Делаю: моушн графику и вставки, анимированные титры, динамичные Reels/Shorts,
  длинные YouTube ролики, 3D ролики и модели, заставки и визуал на экраны
  для концертов и мероприятий, постеры и полиграфию, презентации.
  ИИ креатор: генерация видео и изображений нейросетями, ИИ ролики и реклама.
  Автоматизация через Claude и ИИ: Телеграм боты, ИИ ассистенты, скрипты,
  автоматизация рутины и бизнес процессов под задачу клиента.
  Работаю удалённо.

# Твой Телеграм канал с работами. Бот подбирает из него работы под каждую вакансию.
# Чем понятнее подписи и хэштеги у постов (#рилс #моушн #заставка), тем точнее подбор.
portfolio_channel: ""

# Пересылать подходящие работы из канала под карточку (бот должен быть админом этого канала)
forward_works: false

# Что точно не подходит (ИИ отсекает такое)
not_fit: |
  Бесплатная работа, "за отзыв", "за портфолио", тестовое больше чем на час без оплаты.
  Вакансии не по моим навыкам: обычная разработка сайтов и приложений (боты и автоматизация на ИИ подходят), продажи, SMM без видео, фотограф, оператор на выезд.
  Офис, выезд на съёмку или работа только очно (я работаю удалённо). Курсы, обучение, реклама услуг, спам.

# Минимальная оплата. Оставь пустым, если не важно. Пример: "от 3000 руб за ролик"
min_rate: ""

# Как писать отклик. Это главный текст, по которому ИИ пишет. Правь под себя.
reply_rules: |
  Пиши как живой человек в мессенджере, а не как ИИ и не как продажник. Цель: чтобы заказчик
  захотел открыть работы и ответить.
  Форма:
  1. Первая фраза про ИХ задачу, конкретно, своими словами (видно, что вакансию прочитал).
     Не начинай с "Меня зовут", "Я опытный монтажёр", "Увидел вашу вакансию".
  2. Одна-две фразы, что похожее уже делал, по делу, без оценок своей крутости.
     Ссылок на работы и портфолио не вставляй, примеры я отправлю сам.
  3. Один живой вопрос по их задаче (объём, сроки, исходники, стиль, референсы) или короткая
     мысль, как бы ты это сделал. Это крючок, на который отвечают.
  4. Подпись: Илья (на английском Ilya). Без "С уважением" и без пожеланий.
  Обращение бери из вакансии: если пишут на "ты", отвечай на "ты", иначе на "вы".
  Приветствие короткое: "Привет" или "Здравствуйте", без восклицательных цепочек.
  Длина 300-600 знаков. Без списков, жирного, эмодзи, хэштегов.
  Если в вакансии просят кодовое слово, цену, сроки или формат отклика, выполни это первым делом.
  Не выдумывай цену, сроки, годы опыта, клиентов и факты, которых нет в профиле и подписях работ.
  Пиши на языке вакансии.

  Чего не должно быть (признаки ИИ текста):
  Тире длинное и среднее нигде, вместо них точка, запятая или двоеточие.
  Конструкции "не просто X, а Y", "это не X, это Y", "не только..., но и...".
  Перечисления по три ради ритма ("быстро, качественно и в срок").
  Пафос и оценки: уникальный, качественный, профессиональный подход, индивидуальный подход,
  креативный, вдохнуть жизнь, погрузиться, ключевой, идеально подойду, в кратчайшие сроки, под ключ.
  Вежливые шаблоны: буду рад сотрудничеству, с радостью возьмусь, готов взяться, надеюсь на ответ,
  жду обратной связи, ваш проект заслуживает.
  Короткие эффектные фразы-концовки, которые повторяют сказанное.
  На английском также: thrilled, excited to, passionate, delve, leverage, seamless, I hope this.
  Разная длина предложений, простые слова, как будто пишешь с телефона знакомому заказчику.

  Пример формы (не копируй фразы, у каждой вакансии свой текст):
  Здравствуйте! Вам нужен монтаж рилс для стоматологии с субтитрами, правильно понял?
  Делал похожие ролики для автомобильного аккаунта, могу скинуть примеры.
  Исходники снимаете сами или нужно подбирать стоки? И сколько роликов в месяц планируете?
  Илья

# Слова, при которых сообщение отбрасывается сразу, без ИИ (экономит лимиты)
stopwords:
  - "бесплатно"
  - "за отзыв"
  - "без оплаты"
  - "на бартер"

# Читать публичные каналы через веб версию, даже если аккаунт подключён (меньше нагрузки на аккаунт)
prefer_web: true

# Сколько последних сообщений взять из каждого канала при самом первом запуске
first_run_backfill: 5

# Тема, куда попадают вакансии, на которые ты откликнулся (кнопка «Откликнулся»)
applied_topic: "Мои отклики"

# Твой часовой пояс для дат в карточках
timezone: "Europe/Moscow"

# Как часто проверять каналы, если бот запущен на компьютере (минуты)
loop_minutes: 5

# Модели ИИ. Пробуются по порядку: если одна упёрлась в лимит, берётся следующая.
ai:
  gemini_models:
    - "gemini-flash-latest"
    - "gemini-flash-lite-latest"
    # если эти имена перестанут работать, бот сам найдёт доступную Flash модель
  groq_models:
    - "llama-3.3-70b-versatile"
  batch_size: 8
  # Сколько откликов за запуск можно отправить ИИ на доработку, если в них нашлись признаки ИИ текста
  max_fixes_per_run: 20
